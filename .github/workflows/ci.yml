name: CI

# Pre-flight item P3 (reviewer Ruling 4). Until this existed there was no
# automation on this repository at all: the freeze was enforced by tests nothing
# ran, and FINDING_01 reached production behaviour unopposed.
#
# Two jobs, and the second is the point. `tests` proves the code works.
# `freeze-guard` proves the SCORING MODEL did not change without saying so — the
# check that would have caught FINDING_01 at review time rather than at audit.

on:
  pull_request:
  push:
    branches: [main]

# A superseded run tells you nothing useful; cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Providers are pinned to mock and Turso is blanked so CI can never reach a
  # live vendor or the production warehouse. conftest.py does this too; doing it
  # here as well means a conftest regression cannot silently open the door.
  PROVIDER_MARKET_DATA: mock
  PROVIDER_OPTIONS_CHAIN: mock
  PROVIDER_OPTIONS_FLOW: mock
  PROVIDER_IV_HISTORY: mock
  PROVIDER_INTRADAY: mock
  PROVIDER_NEWS: mock
  PROVIDER_CALENDAR: mock
  PROVIDER_ECON_CALENDAR: mock
  PROVIDER_FUNDAMENTALS: mock
  PROVIDER_BROKERAGE: mock
  TURSO_DATABASE_URL: ""
  TURSO_AUTH_TOKEN: ""
  UW_HISTORIC_ENABLED: "false"
  UW_INTRADAY_ENABLED: "false"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e .
          pip install pytest pytest-asyncio ruff
      # Lints the WHOLE repository, not a list of directories. The previous
      # `app/ scripts/ tests/` form left alembic/ unlinted, so "CI is green" and
      # "the repository is clean" were different statements and a real error sat
      # in the gap. Reviewer Rulings #2, R3.6.
      - name: Lint
        run: python -m ruff check .
      - name: Full test suite
        run: python -m pytest -o addopts="" -q

  # Reviewer Rulings #2, R4 step 4. Three credentials were exposed in a session
  # transcript and were found by an audit, not by a build. A secret reaching the
  # repository must fail here instead of surfacing weeks later in a packet.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks scans history, not just the tip
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  freeze-guard:
    # THE job FINDING_01 argued for. Fails a PR that changes scoring behaviour
    # without declaring it, whether the change is inside the scorer or upstream
    # of it in a provider.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      # SINGLE SOURCE OF TRUTH for what the freeze covers. Both forms below
      # describe the SAME set and are asserted equal by
      # tests/test_freeze_guard_config.py — they drifted once already: the path
      # guard was widened to cover contract selection while the informational
      # diff still looked at two directories, so it kept reporting "unchanged
      # since the freeze" about paths it was not looking at.
      GUARDED_RE: '^(app/shortduration/scoring/|app/shortduration/strategies/|app/shortduration/contracts\.py|app/providers/unusual_whales/client\.py|app/providers/mock/provider\.py|app/engine/iv_context\.py|app/engine/contract_selection\.py)'
      GUARDED_PATHS: 'app/shortduration/scoring/ app/shortduration/strategies/ app/shortduration/contracts.py app/providers/unusual_whales/client.py app/providers/mock/provider.py app/engine/iv_context.py app/engine/contract_selection.py'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need the base ref to diff against

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e .
          pip install pytest pytest-asyncio

      - name: Behavioural freeze controls
        # These three are what actually detect a model change. They run in the
        # `tests` job too; running them here as a named step means the failure
        # reads as "the freeze broke", not "some test failed".
        run: |
          python -m pytest -o addopts="" -q \
            tests/test_scoring_freeze.py \
            tests/test_scoring_golden.py \
            tests/test_provider_scoring_contract.py

      - name: Path guard — scoring touched without declaring it
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Paths whose behaviour IS the frozen model — from the job-level
          # GUARDED_RE so this and the informational diff below cannot disagree.
          # The provider files are included deliberately (FINDING_01 changed the
          # shipped model from unusual_whales/client.py with no diff under
          # scoring/); contract selection was added 2026-08-03 when the same gap
          # appeared a second time, because scoring/components.py:181 reads
          # `plan.risk.reward_to_risk` off the SELECTED PLAN.
          GUARDED="$GUARDED_RE"

          CHANGED="$(git diff --name-only "$BASE" "$HEAD")"
          TOUCHED="$(echo "$CHANGED" | grep -E "$GUARDED" || true)"

          if [ -z "$TOUCHED" ]; then
            echo "No guarded path touched — freeze not implicated."
            exit 0
          fi

          echo "Guarded paths touched:"
          echo "$TOUCHED" | sed 's/^/  /'

          # A guarded change is legitimate ONLY with both a version bump and a
          # dated pre-registration amendment, in the same PR.
          VERSION_BUMPED=0
          git diff "$BASE" "$HEAD" -- app/config.py \
            | grep -qE '^\+.*scoring_model_version' && VERSION_BUMPED=1 || true

          PREREG_AMENDED=0
          git diff "$BASE" "$HEAD" -- docs/CAPTURE_WINDOW_PREREGISTRATION.md \
            | grep -qiE '^\+.*amendment' && PREREG_AMENDED=1 || true

          if [ "$VERSION_BUMPED" = "1" ] && [ "$PREREG_AMENDED" = "1" ]; then
            echo "Declared: scoring_model_version bumped AND pre-registration amended."
            exit 0
          fi

          echo ""
          echo "FREEZE VIOLATION"
          echo "This PR touches a path whose behaviour is the frozen scoring model,"
          echo "without declaring a model change."
          echo ""
          echo "  scoring_model_version bumped : $VERSION_BUMPED"
          echo "  pre-registration amended     : $PREREG_AMENDED"
          echo ""
          echo "See CAPTURE_WINDOW_PREREGISTRATION.md sections 2 and 8, and"
          echo "docs/FREEZE_POINT.md. A legitimate model change needs, in THIS PR:"
          echo "  1. a scoring_model_version bump in app/config.py"
          echo "  2. a dated amendment under pre-registration section 8"
          echo "  3. a regenerated tests/golden/scoring_v3.json with the delta documented"
          echo ""
          echo "If this change does NOT alter scoring behaviour, say so in the PR"
          echo "body and a reviewer can override — do not weaken this job."
          exit 1

      - name: Freeze-point diff (informational)
        # Resolves the tag, falls back to the recorded SHA, and fails loudly if
        # neither is reachable — a check that silently passes because its
        # reference is missing is worse than no check.
        continue-on-error: true
        run: |
          set -uo pipefail
          SHA="$(grep -oE '[0-9a-f]{40}' docs/FREEZE_POINT.md | head -1)"
          # Read the tag NAME from the doc too. It was hardcoded here and went
          # stale the moment the model moved to v4.0, so this step compared
          # against a superseded baseline while reporting reassurance.
          REF="$(grep -oE 'freeze/[A-Za-z0-9._-]+' docs/FREEZE_POINT.md | head -1)"
          if git rev-parse -q --verify "refs/tags/$REF" >/dev/null; then
            POINT="$REF"
          elif git cat-file -e "$SHA^{commit}" 2>/dev/null; then
            POINT="$SHA"
            echo "note: tag $REF unavailable; using the SHA recorded in docs/FREEZE_POINT.md"
          else
            echo "ERROR: neither the freeze tag nor its recorded SHA is reachable."
            exit 1
          fi
          echo "Diff of ALL guarded paths since the freeze point ($POINT):"
          # shellcheck disable=SC2086  # word splitting is intended here
          git diff "$POINT" -- $GUARDED_PATHS | tee /tmp/freeze.diff
          test -s /tmp/freeze.diff \
            && echo "NON-EMPTY — expected only if an amendment covers it." \
            || echo "Empty — scoring paths unchanged since the freeze."
